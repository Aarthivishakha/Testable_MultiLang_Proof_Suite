tool: ESLint Async Rules
slug: eslint-async-rules
language: javascript
category: performance
technique: "Static AST Analysis"
classification: "Async/Await Performance Anti-patterns"
target_files: [../../src/calculator.js, ../../.eslintrc.json]
run:
  command: "npx eslint --rule 'no-await-in-loop:warn' src/"
expects:
  ast_rule_report_generated: true
verified_in_session: false
verified_result: "uses an ESLint core async-performance rule against the real source"
