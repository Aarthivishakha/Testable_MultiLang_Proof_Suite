tool: ESLint AST Rules
slug: eslint-ast-rules
language: javascript
category: performance
technique: "Static AST Analysis"
classification: "Algorithmic Performance Risk"
target_files: [../../src/calculator.js, ../../.eslintrc.json]
run:
  command: "npx eslint --rule 'complexity:[warn,5]' src/"
expects:
  ast_rule_report_generated: true
verified_in_session: false
verified_result: "uses an ESLint core AST rule against the real source"
