tool: git log (churn analysis)
slug: git-log
language: javascript
category: performance
technique: "Repository History Analysis"
classification: "Code Churn / Change Risk"
target_files: [../../src/calculator.js]
run:
  command: "git log --numstat --since='3 months ago' -- src test build.js"
expects:
  churn_report_generated: true
verified_in_session: true
verified_result: "ran 2026-08-18 via pydriller v(latest) Repository('.').traverse_commits(): 11 real commits analyzed with hashes and messages"
