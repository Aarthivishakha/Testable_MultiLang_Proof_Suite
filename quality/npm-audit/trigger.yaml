tool: npm-audit
language: javascript
language_version: "22-26"
technique: "Security White-box Testing"
classification: "Dependency Risk (SCA)"
target_files: [../../package.json, ../../package-lock.json]
run:
  command: "npm audit --json"
expects:
  known_cve_count_gt_0: false
verified_in_session: true
verified_result: "npm audit ran against the real devDependency tree (esbuild, eslint, nyc, stryker, mocha, chai) - reported real result from npm's advisory database"
