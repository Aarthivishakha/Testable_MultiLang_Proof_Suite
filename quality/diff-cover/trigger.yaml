tool: diff-cover
language: javascript
language_version: "12-20"
technique: "Test Regression/Coverage Analysis"
classification: "Coverage Delta"
target_files: [../../coverage/cobertura-coverage.xml]
run:
  command: "npx nyc --reporter=cobertura mocha 'test/**/*.test.js' && diff-cover coverage/cobertura-coverage.xml --compare-branch=main"
requirements:
  - diff-cover (Python, pip install diff-cover)
  - a resolvable `main` branch with shared git history (see main branch merge, commit 5a1bae4)
expects:
  diff_coverage_report_generated: true
verified_in_session: true
verified_result: "real diff-coverage report against main: found real diff lines (src/calculator.js) and computed real (0%) coverage on them - NOT the previous broken 'diff-cover coverage.xml' command which pointed at a nonexistent file and no compare-branch"
known_issue: >
  Real scanner sandbox still reports baseline_missing for the platform's coverage_delta
  category even after this fix and the main-branch merge - appears to only fetch the
  analyzed branch, not main, in its execution sandbox. This is a platform/scanner-side
  gap, not a repo-content gap. Locally verified working as of commit 5a1bae4.
