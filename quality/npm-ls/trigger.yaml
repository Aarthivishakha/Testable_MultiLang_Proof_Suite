tool: npm-ls
language: javascript
language_version: "22-26"
technique: "Security White-box Testing"
classification: "Dependency Risk (SCA)"
target_files: [../../package.json]
run:
  command: "npm ls --all --json"
expects:
  dependency_tree_reported: true
verified_in_session: true
verified_result: "real dependency tree printed for testable-js-proof, including transitive dependencies of esbuild/eslint/nyc/stryker"
