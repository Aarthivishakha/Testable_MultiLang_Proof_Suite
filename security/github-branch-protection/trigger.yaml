tool: GitHub Branch Protection API
slug: github-branch-protection
language: javascript
category: security
technique: "Repo Governance"
classification: "Branch Protection Compliance"
target_files: [../../.github/workflows/ci.yml]
run:
  command: "gh api repos/$GITHUB_REPOSITORY/branches/${TARGET_BRANCH:-javascript1.0}/protection"
expects:
  protection_status_retrieved: true
verified_in_session: false
verified_result: "requires authenticated gh CLI and branch-protection permissions"
