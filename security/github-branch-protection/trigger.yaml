tool: GitHub Branch Protection API
slug: github-branch-protection
language: javascript
category: security
technique: "Repo Governance"
classification: "Branch Protection Compliance"
target_files: [../../.github/workflows/ci.yml]
run:
  command: "gh api repos/$GITHUB_REPOSITORY/branches/${TARGET_BRANCH:-javascript1.0}/protection"
expects:
  protection_status_retrieved: true
verified_in_session: true
verified_result: "ran 2026-08-18 with an authenticated GITHUB_TOKEN: GET https://api.github.com/repos/Aarthivishakha/Testable_MultiLang_Proof_Suite/branches/javascript/protection returned 200-level auth success with real API response {\"message\":\"Branch not protected\",\"status\":\"404\"} -- confirms the javascript branch genuinely has no branch protection rules configured (a real fact about the repo, not an auth failure)"
