openapi: 3.0.3
info:
  title: Testable JavaScript Fixture API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /add:
    get:
      operationId: addNumbers
      parameters:
        - in: query
          name: a
          required: true
          schema: { type: number }
        - in: query
          name: b
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Sum
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: { type: number }
