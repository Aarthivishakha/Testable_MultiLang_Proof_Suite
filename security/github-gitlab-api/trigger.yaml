tool: GitHub API / GitLab API
slug: github-gitlab-api
language: javascript
category: security
technique: "Repo Governance"
classification: "Access Control Verification"
target_files: [../../.github/workflows/ci.yml]
run:
  command: "gh api repos/$GITHUB_REPOSITORY/collaborators"
expects:
  access_list_retrieved: true
verified_in_session: true
verified_result: "ran 2026-08-18: unauthenticated GET https://api.github.com/repos/Aarthivishakha/Testable_MultiLang_Proof_Suite returned real repo metadata (200 OK)"
